[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-agent-mvp"
version = "0.1.0"
description = "Local-first insurance claim decision support MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-ai-slim[openai]>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
